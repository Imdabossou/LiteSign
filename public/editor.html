<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/style.css" />
<script src="/js/theme.js"></script>
<title>Document — LiteSign</title>
<script type="module" src="/js/editor.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Lite<span>Sign</span></a>
    <div class="topbar-title" id="docTitleTop"></div>
    <button class="btn secondary" id="logoutBtn">Log out</button>
  </header>
  <main class="container wide">
    <a class="back-link" href="/">← All documents</a>
    <div id="statusBanner"></div>
    <div class="editor-layout">
      <aside class="editor-sidebar">
        <section class="card">
          <h3>Signers</h3>
          <div id="signerList"></div>
          <form id="addSignerForm" class="add-signer" hidden>
            <div class="field-row">
              <label for="signerName">Name</label>
              <input id="signerName" maxlength="200" placeholder="Jane Doe" required />
            </div>
            <div class="field-row">
              <label for="signerEmail">Email <span class="optional">(optional)</span></label>
              <input id="signerEmail" type="email" maxlength="254" placeholder="jane@example.com" />
            </div>
            <button class="btn secondary block" type="submit">+ Add signer</button>
          </form>
        </section>

        <section class="card" id="fieldCard" hidden>
          <h3>Add fields</h3>
          <p class="hint" id="fieldHint">Pick a signer above, choose a field, then click on the document to place it. Drag fields to move them; drag the corner to resize.</p>
          <div class="field-buttons" id="fieldButtons">
            <button class="btn secondary" data-type="signature">✍️ Signature</button>
            <button class="btn secondary" data-type="initials">AB Initials</button>
            <button class="btn secondary" data-type="text">T Text</button>
            <button class="btn secondary" data-type="date">📅 Date</button>
          </div>
        </section>

        <section class="card" id="sendCard" hidden>
          <h3>Send</h3>
          <p class="hint" id="smtpNotice"></p>
          <div class="field-row">
            <label for="sendNote">Note for the email <span class="optional">(optional)</span></label>
            <textarea id="sendNote" rows="2" maxlength="1000" placeholder="e.g. Please sign by Friday"></textarea>
          </div>
          <button class="btn block" id="sendBtn">Send for signing</button>
        </section>

        <section class="card" id="actionsCard" hidden>
          <div id="actions"></div>
        </section>

        <details class="card" id="auditCard" hidden>
          <summary><h3>Audit trail</h3></summary>
          <ol class="audit" id="auditList"></ol>
        </details>
      </aside>

      <div class="editor-canvas-wrap" id="canvasWrap">
        <div class="empty">Loading document…</div>
      </div>
    </div>
  </main>
</body>
</html>
