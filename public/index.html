<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/style.css" />
<script src="/js/theme.js"></script>
<title>Documents — LiteSign</title>
<script type="module" src="/js/dashboard.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Lite<span>Sign</span></a>
    <button class="btn secondary" id="logoutBtn">Log out</button>
  </header>
  <main class="container">
    <form class="card" id="uploadForm">
      <h2>Upload a document</h2>
      <label class="dropzone" id="dropzone" for="file">
        <input type="file" id="file" accept="application/pdf,.pdf" />
        <span id="dropText"><strong>Choose a PDF</strong> or drag it here</span>
      </label>
      <div class="field-row">
        <label for="title">Title</label>
        <input type="text" id="title" maxlength="200" placeholder="Defaults to the file name" />
      </div>
      <button class="btn" type="submit" id="uploadBtn">Upload &amp; set up signing</button>
      <div class="error-msg" id="uploadErr" role="alert"></div>
    </form>

    <section class="card">
      <div class="card-head">
        <h2>Documents</h2>
        <div class="filters" id="filters" role="tablist">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="draft">Drafts</button>
          <button class="chip" data-filter="pending">Out for signing</button>
          <button class="chip" data-filter="completed">Completed</button>
        </div>
      </div>
      <div id="docList"><div class="empty">Loading…</div></div>
    </section>
  </main>
  <footer class="appfoot">LiteSign: self-hosted document signing</footer>
</body>
</html>
