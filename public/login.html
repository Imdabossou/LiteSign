<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/style.css" />
<script src="/js/theme.js"></script>
<title>Log in — LiteSign</title>
<script type="module" src="/js/login.js"></script>
</head>
<body>
  <main class="login-wrap">
    <form class="card login-card" id="loginForm">
      <h1 class="brand-lg">Lite<span>Sign</span></h1>
      <div class="field-row">
        <label for="password">Admin password</label>
        <input type="password" id="password" autocomplete="current-password" required autofocus />
      </div>
      <button class="btn block" type="submit" id="loginBtn">Log in</button>
      <div class="error-msg" id="err" role="alert"></div>
    </form>
  </main>
</body>
</html>
