<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/style.css" />
<title>Sign document — LiteSign</title>
<script type="module" src="/js/sign.js"></script>
</head>
<body class="sign-page">
  <header class="topbar">
    <span class="brand">Lite<span>Sign</span></span>
    <span class="topbar-title" id="signerNameTop"></span>
  </header>
  <main class="container wide">
    <div id="banner"></div>
    <div class="editor-layout sign-layout" id="layout">
      <aside class="editor-sidebar sign-panel" id="panel" hidden>
        <section class="card">
          <h3 id="docTitle"></h3>
          <p class="hint" id="intro"></p>
          <ol class="checklist" id="fieldChecklist"></ol>
          <div id="finishBox">
            <button class="btn secondary block" id="nextBtn">Next field</button>
            <label class="consent">
              <input type="checkbox" id="consent" />
              <span>I agree to sign this document electronically, and that my electronic signature is as valid as a handwritten one.</span>
            </label>
            <button class="btn block" id="completeBtn" disabled>Finish signing</button>
          </div>
        </section>
      </aside>
      <div class="editor-canvas-wrap" id="canvasWrap">
        <div class="empty">Loading document…</div>
      </div>
    </div>
  </main>

  <!-- Signature / initials -->
  <div class="modal-overlay" id="sigModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="sigModalTitle">
      <h3 id="sigModalTitle">Add your signature</h3>
      <div class="tabs" role="tablist">
        <button class="tab-btn active" id="tabDraw" role="tab">Draw</button>
        <button class="tab-btn" id="tabType" role="tab">Type</button>
      </div>
      <div id="drawPane">
        <canvas class="sigpad-canvas" id="sigCanvas"></canvas>
        <p class="hint">Draw with your mouse, trackpad or finger.</p>
      </div>
      <div id="typePane" hidden>
        <input id="typedSig" maxlength="80" autocomplete="name" placeholder="Type your name" />
        <div class="typed-preview" id="typedPreview"></div>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="sigClear">Clear</button>
        <span class="spacer"></span>
        <button class="btn secondary" id="sigCancel">Cancel</button>
        <button class="btn" id="sigConfirm">Use this</button>
      </div>
    </div>
  </div>

  <!-- Text / date -->
  <div class="modal-overlay" id="textModal" hidden>
    <form class="modal" role="dialog" aria-modal="true" aria-labelledby="textModalTitle" id="textForm">
      <h3 id="textModalTitle">Enter text</h3>
      <input id="textInput" maxlength="500" required />
      <div class="modal-actions">
        <span class="spacer"></span>
        <button class="btn secondary" type="button" id="textCancel">Cancel</button>
        <button class="btn" type="submit">Save</button>
      </div>
    </form>
  </div>
</body>
</html>
