<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sign document — LiteSign</title>
<link rel="stylesheet" href="/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand">Lite<span>Sign</span></div>
    <span id="signerNameTop" style="font-weight:600;"></span>
  </div>
  <div class="container" style="max-width:1100px;">
    <div id="banner"></div>
    <div class="editor-layout">
      <div class="editor-sidebar">
        <div class="card">
          <h4 style="margin-top:0" id="docTitle">Loading…</h4>
          <p class="hint">Fill in every highlighted field, then complete signing. Click a field to fill it in.</p>
          <div id="fieldChecklist"></div>
          <button class="btn" id="completeBtn" style="width:100%; margin-top:10px;" disabled>Complete signing</button>
        </div>
      </div>
      <div class="editor-canvas-wrap" id="canvasWrap">
        <div class="empty">Loading document…</div>
      </div>
    </div>
  </div>

  <!-- Signature / initials modal -->
  <div class="modal-overlay" id="sigModal" style="display:none;">
    <div class="modal">
      <h4 style="margin-top:0" id="sigModalTitle">Add your signature</h4>
      <div class="tabs">
        <button class="tab-btn active" id="tabDraw">Draw</button>
        <button class="tab-btn" id="tabType">Type</button>
      </div>
      <div id="drawPane">
        <canvas class="sigpad-canvas" id="sigCanvas"></canvas>
        <p class="hint">Draw with your mouse or finger.</p>
      </div>
      <div id="typePane" style="display:none;">
        <input id="typedSig" placeholder="Type your name" style="font-size:20px; font-style:italic; padding:14px;" />
      </div>
      <div style="display:flex; gap:8px; margin-top:14px;">
        <button class="btn secondary" id="sigClear">Clear</button>
        <button class="btn secondary" id="sigCancel">Cancel</button>
        <button class="btn" id="sigConfirm" style="margin-left:auto;">Use this</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    let data = null;
    let pageWraps = [];
    let currentFieldId = null;
    const fieldValues = {};
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function load() {
      const res = await fetch('/api/sign/' + token);
      if (!res.ok) {
        document.getElementById('canvasWrap').innerHTML = '<div class="empty">This signing link is invalid or has expired.</div>';
        return;
      }
      data = await res.json();
      document.getElementById('docTitle').textContent = data.document.title;
      document.getElementById('signerNameTop').textContent = data.signer.name;

      if (data.signer.status === 'signed') {
        document.getElementById('banner').innerHTML = '<div class="status-banner completed">You already signed this document. Thank you!</div>';
        document.getElementById('completeBtn').style.display = 'none';
        renderChecklist(true);
        await renderPdf(true);
        return;
      }

      renderChecklist(false);
      await renderPdf(false);
    }

    function renderChecklist(readonly) {
      const el = document.getElementById('fieldChecklist');
      el.innerHTML = data.fields.map(f => `
        <div class="signer-chip" id="chip-${f.id}">
          <span>${f.label || f.type}</span>
          <span id="chip-status-${f.id}">${readonly ? '✅' : (fieldValues[f.id] ? '✅' : '—')}</span>
        </div>`).join('');
    }

    async function renderPdf(readonly) {
      const wrap = document.getElementById('canvasWrap');
      wrap.innerHTML = '';
      pageWraps = [];
      const pdf = await pdfjsLib.getDocument('/api/sign/' + token + '/file').promise;
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const scale = 1.3;
        const viewport = page.getViewport({ scale });
        const pageWrap = document.createElement('div');
        pageWrap.className = 'pdf-page-wrap';
        pageWrap.style.width = viewport.width + 'px';
        pageWrap.style.height = viewport.height + 'px';
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;
        pageWrap.appendChild(canvas);
        wrap.appendChild(pageWrap);
        pageWraps[pageNum - 1] = { el: pageWrap, w: viewport.width, h: viewport.height };
      }
      renderFieldOverlays(readonly);
    }

    function renderFieldOverlays(readonly) {
      data.fields.forEach(f => {
        const pw = pageWraps[f.page];
        if (!pw) return;
        const box = document.createElement('div');
        box.className = 'field-box mine' + (fieldValues[f.id] ? ' filled' : '');
        box.id = 'box-' + f.id;
        box.style.left = (f.x * pw.w) + 'px';
        box.style.top = (f.y * pw.h) + 'px';
        box.style.width = (f.width * pw.w) + 'px';
        box.style.height = (f.height * pw.h) + 'px';

        if (fieldValues[f.id] && (f.type === 'signature' || f.type === 'initials')) {
          box.innerHTML = `<img src="${fieldValues[f.id]}" style="max-width:100%; max-height:100%;" />`;
        } else if (fieldValues[f.id]) {
          box.textContent = fieldValues[f.id];
        } else {
          box.textContent = readonly ? '' : `Click to add ${f.label || f.type}`;
        }

        if (!readonly) box.addEventListener('click', () => openField(f));
        pw.el.appendChild(box);
      });
    }

    function openField(f) {
      currentFieldId = f.id;
      if (f.type === 'signature' || f.type === 'initials') {
        document.getElementById('sigModalTitle').textContent = f.type === 'signature' ? 'Add your signature' : 'Add your initials';
        openSigModal();
      } else if (f.type === 'date') {
        const val = prompt('Date', new Date().toISOString().slice(0, 10)) || '';
        if (val.trim()) setFieldValue(f.id, val.trim());
      } else {
        const val = prompt('Enter text', fieldValues[f.id] || '') || '';
        if (val.trim()) setFieldValue(f.id, val.trim());
      }
    }

    function setFieldValue(fieldId, value) {
      fieldValues[fieldId] = value;
      renderChecklist(false);
      document.querySelectorAll('.field-box').forEach(el => el.remove());
      renderFieldOverlays(false);
      const allFilled = data.fields.every(f => fieldValues[f.id]);
      document.getElementById('completeBtn').disabled = !allFilled;
    }

    // --- signature pad ---
    let drawing = false, lastX = 0, lastY = 0;
    function openSigModal() {
      document.getElementById('sigModal').style.display = 'flex';
      document.getElementById('typedSig').value = '';
      showDrawTab();
      const canvas = document.getElementById('sigCanvas');
      const ratio = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * ratio;
      canvas.height = canvas.clientHeight * ratio;
      const ctx = canvas.getContext('2d');
      ctx.scale(ratio, ratio);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#111';
    }
    function showDrawTab() {
      document.getElementById('tabDraw').classList.add('active');
      document.getElementById('tabType').classList.remove('active');
      document.getElementById('drawPane').style.display = '';
      document.getElementById('typePane').style.display = 'none';
    }
    function showTypeTab() {
      document.getElementById('tabType').classList.add('active');
      document.getElementById('tabDraw').classList.remove('active');
      document.getElementById('typePane').style.display = '';
      document.getElementById('drawPane').style.display = 'none';
    }
    document.getElementById('tabDraw').addEventListener('click', showDrawTab);
    document.getElementById('tabType').addEventListener('click', showTypeTab);

    const sigCanvas = document.getElementById('sigCanvas');
    function pointerPos(e) {
      const rect = sigCanvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return [cx - rect.left, cy - rect.top];
    }
    function startDraw(e) { drawing = true; [lastX, lastY] = pointerPos(e); e.preventDefault(); }
    function moveDraw(e) {
      if (!drawing) return;
      const ctx = sigCanvas.getContext('2d');
      const [x, y] = pointerPos(e);
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y); ctx.stroke();
      [lastX, lastY] = [x, y];
      e.preventDefault();
    }
    function endDraw() { drawing = false; }
    sigCanvas.addEventListener('mousedown', startDraw);
    sigCanvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);
    sigCanvas.addEventListener('touchstart', startDraw, { passive: false });
    sigCanvas.addEventListener('touchmove', moveDraw, { passive: false });
    sigCanvas.addEventListener('touchend', endDraw);

    document.getElementById('sigClear').addEventListener('click', () => {
      const ctx = sigCanvas.getContext('2d');
      ctx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
      document.getElementById('typedSig').value = '';
    });
    document.getElementById('sigCancel').addEventListener('click', () => {
      document.getElementById('sigModal').style.display = 'none';
    });
    document.getElementById('sigConfirm').addEventListener('click', () => {
      const typeMode = document.getElementById('tabType').classList.contains('active');
      let dataUrl;
      if (typeMode) {
        const name = document.getElementById('typedSig').value.trim();
        if (!name) return;
        const c = document.createElement('canvas');
        c.width = 500; c.height = 160;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#111';
        ctx.font = 'italic 52px "Segoe Script", cursive, serif';
        ctx.textBaseline = 'middle';
        ctx.fillText(name, 20, c.height / 2);
        dataUrl = c.toDataURL('image/png');
      } else {
        dataUrl = sigCanvas.toDataURL('image/png');
      }
      setFieldValue(currentFieldId, dataUrl);
      document.getElementById('sigModal').style.display = 'none';
    });

    document.getElementById('completeBtn').addEventListener('click', async () => {
      const values = data.fields.map(f => ({ field_id: f.id, value: fieldValues[f.id] }));
      const res = await fetch('/api/sign/' + token + '/submit', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ values })
      });
      const result = await res.json();
      if (!res.ok) { alert(result.error || 'Could not submit'); return; }
      document.getElementById('banner').innerHTML = '<div class="status-banner completed">Signed successfully! Thank you.</div>';
      document.getElementById('completeBtn').style.display = 'none';
    });

    load();
  </script>
</body>
</html>
